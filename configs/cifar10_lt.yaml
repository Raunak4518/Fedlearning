# configs/cifar10_lt.yaml
# Paper-matched GeFL baseline for CIFAR-10-LT.
# All hyperparameters align with Kang et al. 2025, Tables XIV & XV.
# Generator warm-up: T_KA/2 = 100 rounds, then T_TN = 100 interleaved rounds.

dataset: cifar10
data_root: ./data
num_users: 10
num_models: 3
target_models: cnn_small,cnn_deep,mobilenet_lite
frac: 1.0

noniid: true
dir_param: 0.3
imbalance_factor: 0.01     # CIFAR-10-LT convention (IF=100 <-> 0.01 here)
data_fraction: 0.5         # paper Table XIV: subsample to 50% before partitioning

# target-net optimizer — paper Table XIV
lr: 0.1                    # paper: alpha = 0.1
local_bs: 128              # paper: batch size = 128
optimizer: sgd

# federated schedule — paper Tables XIV/XV
gen_wu_epochs: 100         # T_KA/2 = 100 (pure generator warm-up)
epochs: 100                # T_TN = 100 (interleaved gen + target training)
target_ts: 1               # synthetic-only local epochs (T_s = 1)
target_tr: 5               # real-only local epochs (T_r = 5)
gen_local_ep: 5            # generator local epochs (T_g = 5)

# generator — paper Table XV (CVAE defaults)
gen_model: vae
latent_size: 50            # paper: l = 50
gen_channels: 64
gen_lr: 0.001

mechanism_a: 0
mechanism_b: 0

eval_centralized_upper_bound: 1
centralized_epochs: 20
sample_test: 5

seed: 0
num_experiment: 1
name: gefl_cifar10lt_baseline
